<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B8A9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B8A9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#mainGrad)" opacity="0.15"/>

  <!-- Center Home Icon -->
  <g transform="translate(256, 256)">
    <!-- House shape -->
    <path d="M -80 -40 L 0 -100 L 80 -40 L 80 60 L -80 60 Z" fill="url(#mainGrad)" stroke="white" stroke-width="8"/>
    
    <!-- Door -->
    <rect x="-20" y="0" width="40" height="60" fill="white" opacity="0.9"/>
    <circle cx="15" cy="30" r="3" fill="#00B8A9"/>
    
    <!-- Window -->
    <rect x="-60" y="-20" width="40" height="40" fill="white" opacity="0.7"/>
    <line x1="-40" y1="-20" x2="-40" y2="20" stroke="#00B8A9" stroke-width="2"/>
    <line x1="-60" y1="0" x2="-20" y2="0" stroke="#00B8A9" stroke-width="2"/>
  </g>

  <!-- Service Icons in Circle -->
  <!-- Icon 1: Lightning (Energy/Electrical) - Top -->
  <g transform="translate(256, 100)">
    <circle cx="0" cy="0" r="35" fill="#0891b2" opacity="0.9"/>
    <circle cx="0" cy="0" r="30" fill="white"/>
    <path d="M -5 -8 L 5 0 L 0 8 L 8 8 L -4 20 L -2 10 L -10 10 Z" fill="#0891b2" stroke="#0891b2" stroke-width="2"/>
  </g>

  <!-- Icon 2: Wrench (Maintenance) - Right -->
  <g transform="translate(380, 170)">
    <circle cx="0" cy="0" r="35" fill="#06b6d4" opacity="0.9"/>
    <circle cx="0" cy="0" r="30" fill="white"/>
    <!-- Wrench -->
    <rect x="-12" y="-4" width="24" height="8" rx="4" fill="#06b6d4" transform="rotate(-30 0 0)"/>
    <circle cx="-8" cy="0" r="6" fill="none" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Icon 3: Droplet (Water/Plumbing) - Bottom Right -->
  <g transform="translate(330, 380)">
    <circle cx="0" cy="0" r="35" fill="#10b981" opacity="0.9"/>
    <circle cx="0" cy="0" r="30" fill="white"/>
    <!-- Water droplet -->
    <path d="M 0 -12 C -6 -6 -10 0 -10 6 C -10 12 -5 15 0 15 C 5 15 10 12 10 6 C 10 0 6 -6 0 -12 Z" fill="#10b981"/>
  </g>

  <!-- Icon 4: Brush (Cleaning) - Bottom Left -->
  <g transform="translate(130, 380)">
    <circle cx="0" cy="0" r="35" fill="#10b981" opacity="0.9"/>
    <circle cx="0" cy="0" r="30" fill="white"/>
    <!-- Brush -->
    <rect x="-2" y="2" width="4" height="12" fill="#b8860b"/>
    <line x1="-8" y1="2" x2="8" y2="2" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="5" x2="8" y2="5" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="8" x2="8" y2="8" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Icon 5: Tools (Carpentry) - Left -->
  <g transform="translate(130, 170)">
    <circle cx="0" cy="0" r="35" fill="#0891b2" opacity="0.9"/>
    <circle cx="0" cy="0" r="30" fill="white"/>
    <!-- Hammer head -->
    <rect x="-10" y="-8" width="12" height="12" rx="2" fill="#0891b2"/>
    <!-- Hammer handle -->
    <rect x="-2" y="4" width="4" height="12" fill="#b8860b"/>
  </g>

  <!-- Text: HomeCare360 -->
  <text x="256" y="480" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#030213">
    HomeCare360
  </text>
</svg>
