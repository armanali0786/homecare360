    <!-- ===================== Structured Data: Organization ===================== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Homecare360",
      "legalName": "Homecare360",
      "description": "Professional home care services connecting users with trusted, verified caregivers and health service providers.",
      "url": "https://homecare360.netlify.app",
      "logo": {
        "@type": "ImageObject",
        "url": "https://homecare360.netlify.app/logo.png",
        "width": 512,
        "height": 512
      },
      "image": "https://homecare360.netlify.app/og-image.png",
      "email": "support@homecare360.com",
      "sameAs": [
        "https://www.facebook.com/homecare360",
        "https://www.twitter.com/homecare360",
        "https://www.linkedin.com/company/homecare360",
        "https://www.instagram.com/homecare360"
      ]
    }
    </script>

    <!-- ===================== Structured Data: WebSite + SearchAction ===================== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Homecare360",
      "url": "https://homecare360.netlify.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://homecare360.netlify.app/services?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ===================== Structured Data: LocalBusiness / MedicalBusiness ===================== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalBusiness",
      "name": "Homecare360",
      "description": "Professional in-home care services including caregiving, companion care, elder care, and health services",
      "url": "https://homecare360.netlify.app",
      "image": "https://homecare360.netlify.app/og-image.png",
      "priceRange": "$$",
      "areaServed": {
        "@type": "Country",
        "name": "India"
      },
      "hasMap": "https://homecare360.netlify.app/services",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "support@homecare360.com",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- ===================== Structured Data: Service ===================== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Home Care Services",
      "description": "Professional in-home care services including caregiving, companion care, and health services",
      "provider": {
        "@type": "Organization",
        "name": "Homecare360",
        "url": "https://homecare360.netlify.app"
      },
      "serviceType": "Home Care",
      "availableChannel": {
        "@type": "ServiceChannel",
        "serviceUrl": "https://homecare360.netlify.app",
        "servicePhone": "support@homecare360.com",
        "availableLanguage": "English"
      },
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "INR",
        "lowPrice": "500",
        "highPrice": "5000"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
